name: CotizaFlow release smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static release safety checks
        run: python -m unittest discover -s tests -p 'test_release_smoke.py' -v
      - name: Verify Render preview contains every imported payment and Auth module
        run: node --test tests/render-preview-dependency-parity.test.mjs
      - name: Test app-specific registration and recovery safeguards
        run: python -m unittest discover -s tests -p 'test_auth_policy.py' -v
      - name: Assert per-tab session isolation and recovery boundaries
        run: python3 tests/test_session_boundaries.py
      - name: Check hostile backup imports and allowlisted fields
        run: node --test tests/backup-security.test.mjs
      - name: Confirm checkout return never grants unverified Pro
        run: node --test test-billing-return.mjs
      - name: Recheck report authorization after cancellation or status outage
        run: node --test tests/pro-report-reverify.test.cjs
      - name: Prevent stale subscription status from restoring Pro actions
        run: node --test tests/pro-plan-status-race.test.cjs
      - name: Verify Pro API response allowlists and quota rejection
        run: node --test tests/edge-response-contract.test.cjs
      - name: Verify printable branding rejects script and CSS injection
        run: node --test tests/pro-safety.test.mjs
      - name: Confirm app-specific Supabase CORS (no payments or signups)
        run: python3 -m unittest discover -s tests -p 'test_edge_origins.py' -v
      - name: Verify production custom HTTPS routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cotizaflow.sequeidaulabs.com'
          for ROUTE in / /cloud.mjs /pro.mjs; do
            HTTP=$(curl --fail --silent --show-error -L --retry 3 --retry-delay 3 --max-time 30 -o /tmp/cotizaflow-domain -w '%{http_code}' "$BASE$ROUTE")
            echo "$BASE$ROUTE -> HTTP $HTTP"
            test "$HTTP" = '200'
          done
