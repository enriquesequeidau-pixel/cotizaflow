name: Encrypted cloud backup roundtrip QA
on:
  pull_request:
    paths:
      - 'cloud.mjs'
      - 'cloud-crypto.mjs'
      - 'tests/e2e-cloud-encrypted.py'
      - '.github/workflows/cloud-encryption-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Test upload encryption, wrong key, cloud read and restoration in Chromium
        run: python tests/e2e-cloud-encrypted.py
