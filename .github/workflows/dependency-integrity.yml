name: CotizaFlow dependency integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit all first-party imports and reject unexpected dependencies
        run: python3 tests/test_dependency_integrity.py
      - name: Verify client-side backup encryption and safe restore compatibility
        run: node --test tests/cloud-encryption.test.mjs
      - name: Verify syntax of all shipped application modules
        shell: bash
        run: |
          set -euo pipefail
          for FILE in app.mjs backup.mjs check.mjs cloud.mjs cloud-crypto.mjs core.mjs plan-checkout.mjs pro-safety.mjs pro.mjs workflow.mjs smoke.mjs; do
            node --check "$FILE"
          done
