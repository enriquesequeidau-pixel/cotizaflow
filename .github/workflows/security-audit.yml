name: Security audit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan entire Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          set +e
          /tmp/gitleaks-bin/gitleaks git --config .gitleaks.toml --redact --exit-code 0 --report-format json --report-path /tmp/gitleaks-report.json --log-opts="--all" .
          SCAN_STATUS=$?
          set -e
          if [ "$SCAN_STATUS" != 0 ]; then echo "Scanner execution error"; exit "$SCAN_STATUS"; fi
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          report = Path('/tmp/gitleaks-report.json')
          findings = json.loads(report.read_text()) if report.exists() else []
          print("Number of potential leaks:", len(findings))
          counts = Counter((x.get('RuleID','unknown'),x.get('File','unknown')) for x in findings)
          for (rule, filename), count in sorted(counts.items()):
              print(f"{rule} | {filename} | count={count}")
          if findings:
              raise SystemExit("Possible secrets in Git history: review and rotate confirmed credentials before release.")
          PY
