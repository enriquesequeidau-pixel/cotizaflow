# Safe, non-live Blueprint staging for the EXISTING cotizaflow-comercial-preview static site.
# Adding this file does NOT link a Blueprint or change DNS/production hosting.
# Do NOT provision an additional Render service. Confirm linking and inspect the
# preview's HTTP headers and purchase/recovery flows before changing public DNS.
services:
  - type: web
    name: cotizaflow-comercial-preview
    runtime: static
    repo: https://github.com/enriquesequeidau-pixel/cotizaflow
    branch: main
    autoDeployTrigger: off
    buildCommand: mkdir -p dist && cp index.html style.css brand-symbol.svg app.mjs cloud.mjs pro.mjs backup.mjs core.mjs workflow.mjs plan-checkout.mjs billing-return.mjs auth-captcha.mjs cloud-crypto.mjs pro-safety.mjs pro-calendar-action.mjs followup-calendar.mjs pro-duplicate-action.mjs quote-duplicate.mjs pro-commercial-report-action.mjs commercial-report.mjs privacidad.html terminos.html dist/
    staticPublishPath: dist
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://nrwbnjjaqilgreqhpcov.supabase.co https://challenges.cloudflare.com; img-src 'self' data: blob:; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
